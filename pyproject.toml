[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".snakemake", "notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C4", "B", "UP"]
ignore = ["E501", "B905", "C408"]

[tool.ruff.lint.per-file-ignores]
"*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["config", "src"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = false
